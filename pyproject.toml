[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "agentscope-lab"
version = "0.7.0"
description = "Local-first agent observability and reliability lab with OpenTelemetry"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1", "httpx>=0.28,<1", "opentelemetry-sdk>=1.30,<2", "opentelemetry-proto>=1.30,<2", "langgraph>=1,<2", "mcp>=1.20,<2"]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.24"]

[tool.setuptools.packages.find]
include = ["agentscope*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
